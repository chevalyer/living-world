name: validate

on:
  push:
    branches:
      - main
      - "update/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: LivingWorld

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup .net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: structural checks
        run: python3 scripts/check_sources.py

      - name: restore
        run: dotnet restore LivingWorld.sln --nologo

      - name: build
        run: dotnet build LivingWorld.sln -c Release --no-restore --nologo

      - name: regression tests
        run: dotnet run --project Tests/LivingWorld.Tests.csproj -c Release --no-build

      - name: headless smoke
        run: dotnet run --project Headless/LivingWorld.Headless.csproj -c Release --no-build -- --seed 1847 --size 96 --npcs 8 --ticks 1440 --json artifacts/smoke.json

      - name: seven day stability run
        run: dotnet run --project Headless/LivingWorld.Headless.csproj -c Release --no-build -- --seed 1847 --size 128 --npcs 14 --ticks 10080 --json artifacts/week.json

      - name: thirty day multi-seed behavior soak
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[soak]')
        run: |
          for seed in 7 1847 9001; do
            dotnet run --project Headless/LivingWorld.Headless.csproj -c Release --no-build -- \
              --seed "$seed" --size 96 --npcs 14 --ticks 43200 --json "artifacts/behavior-$seed.json"
          done

      - name: inspect behavior soak
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[soak]')
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path("artifacts").glob("behavior-*.json"))
          assert len(files)==3, "missing behavior soak output"
          for path in files:
              data=json.loads(path.read_text())
              assert data["simulation_tick"]==43200, f"{path}: incomplete simulation"
              assert data["population"]>0, f"{path}: population collapsed"
              print(path.name, "population", data["population"], "failures", data["action_failures"], "deaths", data["deaths"])
          PY

      - name: 320 day lifecycle soak
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[soak]')
        run: |
          dotnet run --project Headless/LivingWorld.Headless.csproj -c Release --no-build -- \
            --seed 1847 --size 64 --npcs 14 --ticks 460800 --json artifacts/lifecycle.json

      - name: inspect lifecycle
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[soak]')
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("artifacts/lifecycle.json").read_text())
          assert data["simulation_tick"]==460800, "lifecycle simulation incomplete"
          assert data["population"]>0, "lifecycle population collapsed"
          print("lifecycle population", data["population"])
          print("lifecycle deaths", data["deaths"])
          print("lifecycle failures", data["action_failures"])
          print("lifecycle failure reasons", data["failure_reasons"])
          PY

      - name: install godot 4.7.1 .net
        run: |
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -type f -name 'Godot_v4.7.1-stable_mono_linux.x86_64' | head -n 1)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: build godot debug assembly
        run: dotnet build LivingWorld.csproj -c Debug --no-restore --nologo

      - name: godot headless scene smoke
        run: |
          mkdir -p artifacts
          "$GODOT" --headless --path . --quit-after 300 2>&1 | tee artifacts/godot-headless.log
